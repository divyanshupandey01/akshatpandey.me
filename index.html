<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akshat Pandey — Under Maintenance</title>
<style>
  :root{
    --bg:#0b0b0c;
    --panel:#141416;
    --red:#ff4d3d;
    --red-dim:#7a2a22;
    --text:#f2f0ec;
    --muted:#9a9a9e;
    --border:#2a2a2d;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(255,77,61,0.10), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(255,77,61,0.06), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
  }

  .wrap{
    width:100%;
    max-width:640px;
    text-align:center;
  }

  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    color:var(--red);
    font-size:13px;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-weight:700;
    margin-bottom:28px;
  }
  .eyebrow::before{
    content:"";
    width:18px;
    height:2px;
    background:var(--red);
    display:inline-block;
  }

  h1{
    font-size:clamp(2.4rem, 7vw, 3.6rem);
    line-height:1.05;
    margin:0 0 8px;
    font-weight:800;
    letter-spacing:-0.02em;
  }
  h1 .last{
    color:var(--red);
    text-shadow: 0 0 24px rgba(255,77,61,0.35);
  }

  .tagline{
    font-style:italic;
    color:var(--muted);
    font-size:1rem;
    margin:18px 0 26px;
    border-left:3px solid var(--red);
    padding-left:12px;
    display:inline-block;
    text-align:left;
  }

  p.body{
    color:var(--muted);
    font-size:1.02rem;
    line-height:1.6;
    max-width:480px;
    margin:0 auto 34px;
  }

  .status-card{
    display:inline-flex;
    align-items:center;
    gap:10px;
    background:var(--panel);
    border:1px solid var(--border);
    padding:10px 18px;
    border-radius:999px;
    font-size:14px;
    color:var(--text);
    margin-bottom:36px;
  }
  .dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--red);
    box-shadow:0 0 0 0 rgba(255,77,61,.6);
    animation:pulse 1.8s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(255,77,61,.55); }
    70%{ box-shadow:0 0 0 10px rgba(255,77,61,0); }
    100%{ box-shadow:0 0 0 0 rgba(255,77,61,0); }
  }

  .bar-outer{
    width:100%;
    max-width:420px;
    height:6px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:999px;
    margin:0 auto 40px;
    overflow:hidden;
  }
  .bar-inner{
    height:100%;
    width:62%;
    background:linear-gradient(90deg, var(--red-dim), var(--red));
    border-radius:999px;
  }

  .links{
    display:flex;
    justify-content:center;
    gap:14px;
    flex-wrap:wrap;
  }
  .links a{
    color:var(--text);
    text-decoration:none;
    border:1px solid var(--border);
    padding:10px 16px;
    border-radius:10px;
    font-size:14px;
    font-weight:600;
    transition:border-color .2s, color .2s, transform .2s;
  }
  .links a:hover{
    border-color:var(--red);
    color:var(--red);
    transform:translateY(-2px);
  }
  .links a.primary{
    background:var(--red);
    border-color:var(--red);
    color:#0b0b0c;
  }
  .links a.primary:hover{
    color:#0b0b0c;
    filter:brightness(1.08);
    transform:translateY(-2px);
  }

  footer{
    margin-top:56px;
    color:#5c5c60;
    font-size:12.5px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">Patna, India · Entrepreneur</div>

    <h1>Akshat <span class="last">Pandey</span></h1>

    <div class="tagline">"Embrace The Grind"</div>

    <p class="body">
      This site is being rebuilt behind the scenes — new work, new tools,
      same relentless pace. Back online shortly.
    </p>

    <div class="status-card">
      <span class="dot"></span>
      Building in public — maintenance in progress
    </div>

    <div class="bar-outer">
      <div class="bar-inner"></div>
    </div>

    <div class="links">
      <a href="mailto:hello@akshatpandey.me" class="primary">Get in Touch →</a>
      <a href="https://instagram.com/scionash" target="_blank" rel="noopener">Instagram</a>
    </div>

    <footer>&copy; <span id="year"></span> Akshat Pandey. All rights reserved.</footer>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
